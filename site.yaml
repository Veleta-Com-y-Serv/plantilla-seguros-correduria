      - { texto: "Se me inundó la cocina un domingo. El lunes a primera hora ya tenía el parte abierto y el perito vino a casa esa misma semana.", autor: Rocío Márquez, cargo: "Seguro de hogar, Isla Chica", nota: "5" }
