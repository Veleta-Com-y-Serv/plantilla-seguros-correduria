    resalte: antes de contratar
    cta: { texto: Pregúntanos lo que quieras, url: "/#contacto" }
    preguntas:
      - { pregunta: "¿Qué diferencia hay entre un corredor y un agente de seguros?", respuesta: "El agente trabaja para una sola compañía. El corredor es independiente: compara entre varias y te recomienda por escrito la que mejor encaja contigo." }
      - { pregunta: "¿Me cuesta algo la comparativa?", respuesta: "No. La comparativa y el asesoramiento no se pagan aparte. Solo pagas la prima de la póliza que elijas." }
      - { pregunta: "¿Puedo cambiar mi seguro actual aunque no haya vencido?", respuesta: "Hay que avisar a tu compañía con un mes de antelación antes del vencimiento. Te ayudamos con la carta y con las fechas para que no te quedes sin cobertura." }
      - { pregunta: "¿Qué hago si tengo un siniestro?", respuesta: "Llámanos o escríbenos por WhatsApp. Abrimos el parte, hablamos con la compañía y con el perito, y te contamos cada paso hasta que se resuelve." }
      - { pregunta: "¿Atendéis fuera de Huelva capital?", respuesta: "Sí. Tenemos clientes en toda la provincia y en el resto de España. Lo podemos hacer todo por teléfono, correo y firma desde el móvil." }

